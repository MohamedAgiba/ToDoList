<div>
    <h1 class="text-center text-primary">{{Title}}</h1>
    <img [src]="imageLink" alt="Sample Img" width="300" class="img-fluid mx-auto d-block mb-3">
    <div class="container">
        <div class="row">
            <div class="col-sm-10">
                <input type="text" class="form-control" placeholder="Add a new task" [(ngModel)]="newTask">
            </div>
            <div class="col-sm-2">
                <button type="submit" class="btn btn-primary" (click)="addTask()">Add</button>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <table class="table table-striped table-dark mt-3">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Edit</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td><button type="submit" class="btn btn-success" (click)="editTask()">Edit</button></td>
                            <td><button type="submit" class="btn btn-danger" (click)="removeTask()">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
