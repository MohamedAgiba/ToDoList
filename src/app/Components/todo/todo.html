<section class="todo">
  <h1>Todo List</h1>
  @for (todo of todos; track todo.id) {
    <ul class="todo-list">
    <li>
      <span>Learn Angular</span>
      <button>Details</button>  
    </li>

    <li>
      <span>Build Todo App</span>
      <button>Details</button>
    </li>
  </ul>
  }
  <div class="add-todo">
    <input type="text" placeholder="Add new task">
    <button>Add</button>
  </div>

 
</section>
